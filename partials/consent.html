<div class="consent" id="consent" role="region" aria-label="Cookie preferences" hidden>
  <div class="consent-card">
    <div class="consent-text">
      <strong>Cookies &amp; embedded content</strong>
      <p>We use a few essential cookies to keep the quote form and chat working. Optional analytics and the embedded Google map only load if you allow them. <a href="cookie-policy.html">Cookie Policy</a></p>
    </div>
    <div class="consent-actions">
      <button type="button" class="btn btn-navy" data-consent-accept>Allow all</button>
      <button type="button" class="btn btn-outline" data-consent-reject>Essential only</button>
      <button type="button" class="consent-link" data-consent-customize aria-expanded="false" aria-controls="consent-options">Customize</button>
    </div>
    <form class="consent-options" id="consent-options" hidden>
      <label class="consent-option"><input type="checkbox" checked disabled> <span><strong>Essential</strong> — security (CAPTCHA), your text-size and cookie choices, chat session. Always on.</span></label>
      <label class="consent-option"><input type="checkbox" name="analytics"> <span><strong>Analytics</strong> — privacy-friendly page-view counts so we can see which services people look for.</span></label>
      <label class="consent-option"><input type="checkbox" name="embeds"> <span><strong>Embedded content</strong> — the Google map on the contact page.</span></label>
      <button type="submit" class="btn btn-navy">Save choices</button>
    </form>
  </div>
</div>
